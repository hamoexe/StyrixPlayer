plugins {
    id 'com.android.application'
}

// Release signing: reads keystore.properties from the project root (kept out of git).
// No file = the release APK is built unsigned, so the build still works.
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.hamo.styrixplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.hamo.styrixplayer"
        minSdk 26
        targetSdk 34
        versionCode 79
        versionName "1.22.2"
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:0.26.5'

    def media3 = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.media3:media3-common:$media3"
}
